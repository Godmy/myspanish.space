# Заготовка деплоя на Cloudflare Pages.
# Ничего не публикует, пока в репозитории не заданы секреты:
#   CLOUDFLARE_API_TOKEN   — scope: Account · Cloudflare Pages · Edit
#   CLOUDFLARE_ACCOUNT_ID   — c98f42620906e66b20246d8402791a19
# Без них job build проходит (проверка сборки), а deploy-шаг пропускается.

name: deploy-myspanish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # Библиотека компонентов лежит рядом и подключается по алиасу $stylist
      # (../stylist-svelte/src/lib). Нужны и её git-сабмодули (theme/svg/...).
      - name: Checkout stylist-svelte (sibling)
        uses: actions/checkout@v4
        with:
          repository: Godmy/stylist-svelte
          path: stylist-svelte-src
          submodules: recursive
          fetch-depth: 1

      - name: Place stylist-svelte as sibling
        run: |
          mv stylist-svelte-src ../stylist-svelte
          ls ../stylist-svelte/src/lib/theme >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install stylist-svelte deps
        working-directory: ../stylist-svelte
        run: yarn install --immutable && yarn svelte-kit sync

      - name: Install site deps
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name myspanish-space --branch "${GITHUB_REF_NAME}"
