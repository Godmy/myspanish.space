# Заготовка деплоя на Cloudflare Pages.
# Ничего не публикует, пока в репозитории не заданы секреты:
#   CLOUDFLARE_API_TOKEN   — scope: Account · Cloudflare Pages · Edit
#   CLOUDFLARE_ACCOUNT_ID   — c98f42620906e66b20246d8402791a19
# Без них job build проходит (проверка сборки), а deploy-шаг пропускается.

name: deploy-myspanish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # Общая библиотека лежит на два уровня выше сайта (как локально:
      # D:\2026\cloudflare\stylist-svelte рядом с myspanish.space\myspanish.space)
      # и подключается через portal + moduleAliases(modules.json).
      - name: Checkout stylist-svelte (shared library)
        uses: actions/checkout@v4
        with:
          repository: Godmy/stylist-svelte
          path: stylist-svelte-src
          submodules: false
          fetch-depth: 1

      - name: Place stylist-svelte at ../../stylist-svelte
        run: mv stylist-svelte-src ../../stylist-svelte

      # Публичные модули (design-system, interaction, information, ...) нужны сайту;
      # приватные без токена недоступны и сайту не нужны — пропускаем их.
      - name: Init public library modules
        working-directory: ../../stylist-svelte
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          for path in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            git submodule update --init --recursive --depth 1 -- "$path" || echo "skip private module: $path"
          done
          ls modules/design-system >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install stylist-svelte deps
        working-directory: ../../stylist-svelte
        run: yarn install --immutable

      - name: Install site deps
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name myspanish-space --branch "${GITHUB_REF_NAME}"
